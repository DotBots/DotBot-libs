name: CI 

on:
  push:
    branches:
      - main
    tags: '*'

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["dotbot-v2", "dotbot-v3", "nrf52833dk", "nrf52840dk", "nrf5340dk-app", "nrf5340dk-net"]
        config: ["Debug", "Release"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Build projects
        run: BUILD_TARGET=${{ matrix.target }} BUILD_CONFIG=${{ matrix.config }} make docker

  build-success:
    # this is only run if all builds succeeded
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: build succeeded
      run: exit 0

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run host-side tests
        run: make test

  style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Check style
        run: make check-format

  doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install Doxygen
        run: sudo apt-get install -y doxygen graphviz
      - name: Install Sphinx
        run: python -m pip install -r doc/sphinx/requirements.txt
      - name: Build documentation
        run: make doc

  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Fetch wasi-sdk
        run: wasm/fetch-wasi-sdk.sh
      - name: Build the control core as WebAssembly
        run: make wasm
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install check dependencies
        run: pip install "wasmtime>=49,<55" numpy
      - name: Check the wasm build
        run: python wasm/check.py
      - name: Upload the wasm build
        if: >-
          github.event_name == 'push' &&
          startsWith(github.event.ref, 'refs/tags')
        uses: actions/upload-artifact@v4
        with:
          name: dotbot_control.wasm
          path: build/wasm/dotbot_control.wasm

  # Disable Docker build for now because SEGGER requires authentication
  # to download SEGGER Embedded Studio
  # docker:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout repo
  #       uses: actions/checkout@v4
  #     - name: Build docker image
  #       run: docker build -t dotbot .

  release:
    runs-on: ubuntu-latest
    # needs: [docker, doc, style, build-success]
    needs: [doc, style, host-tests, wasm, build-success]
    permissions:
      contents: write
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.ref, 'refs/tags')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
